<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ghost Cam Pro v1.6.2</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #fffc00; --bg: #000; --radius: 15px; }
        html, body { margin: 0; padding: 0; height: 100dvh; width: 100vw; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; position: fixed; }
        #overlay-start { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .start-btn { background: var(--accent); color: #000; border: none; padding: 20px 50px; border-radius: 50px; font-weight: 900; cursor: pointer; }

        .app-container { display: grid; grid-template-columns: 1fr 320px; height: 100dvh; width: 100vw; box-sizing: border-box; padding: 10px; gap: 10px; }
        #remote-wrapper { background: #111; border-radius: var(--radius); overflow: hidden; border: 1px solid #333; display: flex; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        .side-panel { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }

        #local-wrapper { width: 100%; height: 240px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #444; flex-shrink: 0; }
        #local-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .btn-stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; flex-shrink: 0; }
        .action-btn { background: #222; color: white; border: 1px solid #444; padding: 12px 0; border-radius: 10px; font-size: 20px; cursor: pointer; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; border-radius: var(--radius); border: 1px solid #222; overflow: hidden; min-height: 0; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; }
        .msg.me { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; }
        .msg.peer { align-self: flex-start; background: #333; }
        .chat-input-row { background: #111; border-top: 1px solid #222; padding: 8px; display: flex; gap: 8px; flex-shrink: 0; }
        #msg-input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 16px; outline: none; }

            .app-container { display: flex; flex-direction: column; gap: 5px; padding: 5px; }
            #remote-wrapper { height: 40vh; flex: none; }
            .side-panel { display: flex; flex-direction: column; gap: 5px; flex: 1; }
